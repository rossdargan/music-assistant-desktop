name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build MusicAssistantMini.sln -c Release

      - name: Test
        run: dotnet test MusicAssistantMini.sln -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Publish (framework-dependent, win-x64)
        run: dotnet publish src/MaMini.App/MaMini.App.csproj -c Release -r win-x64 --self-contained false -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: MaMini-win-x64
          path: publish
